<script>
// Appearance: 'auto' follows the device, or force 'light' / 'dark'. Set before the first paint.
var THEME_KEY = 'inat_theme', themeMq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;

  try { t = t || localStorage.getItem(THEME_KEY) || 'auto'; } catch (e) { t = t || 'auto'; }
  var dark = t === 'dark' || (t === 'auto' && !!themeMq && themeMq.matches);
  document.documentElement.classList.toggle('dark', dark);

<style>
  :root { --hw:'Caveat','Segoe Print','Bradley Hand','Comic Sans MS',cursive; }

  /* the header row is the tab on a strip of the parent folder's paper colour (or the desk for the outermost); it sticks, every level stacked one row below its parent; a row that scrolls away slides behind its parents' rows. A plain strip at the foot of each tab joins the plain band along the folder's top. */

// ---------- logging ----------
function log(msg, level) {
  (level === 'e' ? console.error : level === 'w' ? console.warn : console.log)('[inat]', msg); // the console is the only log now
}

// ---------- OAuth (authorization code + PKCE) ----------
const OAUTH = {
  // Asked-for permission: iNaturalist's defaults. The narrower 'login' scope alone is refused (403) when exchanging the OAuth token for an API token.
  scope: 'login write',
  clientId: 'DxvOJs7iJzOocp-IqF316qt_IRDMdtKVFAERyQU0Jak', // public identifier of the registered app (PKCE flow: no client secret is used or stored)
  authorize: 'https://www.inaturalist.org/oauth/authorize',
  token: 'https://www.inaturalist.org/oauth/token',
  apiToken: 'https://www.inaturalist.org/users/api_token',
};
const OAUTH_KEY = 'inat_oauth', CLIENT_KEY = 'inat_client_id';
const redirectUri = () => location.origin + location.pathname;
const clientId = () => OAUTH.clientId;
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const rand = n => b64url(crypto.getRandomValues(new Uint8Array(n)));

async function oauthLogin() {
  const id = clientId();
  const verifier = rand(48), st = rand(16);
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  try { sessionStorage.setItem('inat_pkce', JSON.stringify({ verifier, st })); sessionStorage.setItem('inat_resume', location.search); } catch (e) { log('sessionStorage failed: ' + e, 'e'); }
  const url = `${OAUTH.authorize}?` + new URLSearchParams({
    client_id: id, redirect_uri: redirectUri(), response_type: 'code',
    code_challenge: challenge, code_challenge_method: 'S256', state: st, scope: OAUTH.scope,
  });
  log(`redirecting to OAuth authorize (redirect_uri=${redirectUri()})`);
  location.href = url;
}

// Returns true if the page was opened by an OAuth redirect (code or error present).
async function oauthCallback() {
  const q = new URLSearchParams(location.search);
  if (!q.has('code') && !q.has('error')) return false;
  history.replaceState({}, '', redirectUri() + startSearch); // restore the shared-link parameters
  try { sessionStorage.removeItem('inat_resume'); } catch {}
  if (q.has('error')) { status(`OAuth error: ${q.get('error_description') || q.get('error')}`, true); log(`oauth error: ${q}`, 'e'); return true; }
  let saved = {};
  try { saved = JSON.parse(sessionStorage.getItem('inat_pkce') || '{}'); sessionStorage.removeItem('inat_pkce'); } catch {}
  if (!saved.st || saved.st !== q.get('state')) { status('OAuth state mismatch; please try logging in again.', true); log('oauth state mismatch', 'e'); return true; }
  status('Completing login…');
  try {
    log(`POST ${OAUTH.token}`);
    const res = await fetch(OAUTH.token, {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ client_id: clientId(), grant_type: 'authorization_code', code: q.get('code'),
        redirect_uri: redirectUri(), code_verifier: saved.verifier }),
    });
    const body = await res.text();
    log(`  → ${res.status}${res.ok ? '' : ' ' + body.slice(0, 300)}`, res.ok ? '' : 'e');
    if (!res.ok) throw new Error(`OAuth token exchange failed (${res.status})`);
    const access = JSON.parse(body).access_token;
    try { localStorage.setItem(OAUTH_KEY, access); } catch {}
    await mintJwt(access);
  } catch (e) {
    log(`oauth callback failed: ${e.stack || e}`, 'e');
    status(`${e.message}. Please try signing in again.`, true);
  }
  return true;
}

// Exchange the OAuth access token for the JWT that api.inaturalist.org expects.
async function mintJwt(access) {
  log(`GET ${OAUTH.apiToken} [oauth bearer]`);
  const res = await fetch(OAUTH.apiToken, { headers: { Authorization: `Bearer ${access}` } });
  log(`  → ${res.status}`, res.ok ? '' : 'e');
  if (res.status === 403) { // this login was granted too little (e.g. an older, narrower scope): drop it so the next login asks again
    try { localStorage.removeItem(OAUTH_KEY); } catch {}
    throw new Error('This login does not allow API access. Log in with iNaturalist again.');
  }
  if (!res.ok) throw new Error(`Could not get an API token from the OAuth login (${res.status})`);
  const jwt = (await res.json()).api_token;
  $('token').value = jwt; store.set(jwt);
  return jwt;
}

function jwtExpiry(jwt) {
  try { return JSON.parse(atob(jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).exp * 1000; } catch { return 0; }
}
// If the cached JWT is (nearly) expired and we have an OAuth login, quietly mint a new one.
async function ensureFreshJwt() {
  const jwt = $('token').value.trim();
  let access = ''; try { access = localStorage.getItem(OAUTH_KEY) || ''; } catch {}
  if (!access) return;
  if (!jwt || jwtExpiry(jwt) < Date.now() + 60000) {
    log('API token missing/expired; refreshing via OAuth login');
    await mintJwt(access);
  }
}
function authLabel() {
  let access = ''; try { access = localStorage.getItem(OAUTH_KEY) || ''; } catch {}
  $('oauth').title = $('oauth').ariaLabel = access ? 'Sign in again' : 'Sign in with iNaturalist';
  syncSignin();
}

// The cover shows a paper "Sign in" sticker until someone is signed in (or a shared link is being viewed).
function syncSignin() {
  let access = ''; try { access = localStorage.getItem(OAUTH_KEY) || ''; } catch {}
  const out = !access && !isOther();
  $('signin').hidden = !out;
  $('covername').hidden = out;
}

const store = {
  get() { try { return localStorage.getItem(KEY) || ''; } catch { return ''; } },
  set(v) { try { localStorage.setItem(KEY, v); } catch (e) { log('localStorage write failed: ' + e, 'w'); } },
  del() { try { localStorage.removeItem(KEY); } catch {} },

// ---------- favourites bookkeeping: which species lack a favourite, and which have new observations since it was set ----------
// prefMeta[tid] = { max: highest observation id of that taxon when the favourite was chosen (or last reviewed), t: time }.
// An observation is "new" if its id is above that mark.
const META_KEY = 'inat_pref_meta';
let prefMeta = {}, favVer = 0, favSig = '', favCache = null;
try { prefMeta = JSON.parse(localStorage.getItem(META_KEY) || '{}') || {}; } catch { prefMeta = {}; }
const savePrefMeta = () => { try { localStorage.setItem(META_KEY, JSON.stringify(prefMeta)); } catch {} };
function maxObsId(tid) { let m = 0; for (const o of state.obs) if (o.tid === tid && o.id > m) m = o.id; return m; }
function dismissNew(tid) { prefMeta[tid] = { max: maxObsId(tid), t: Date.now(), dismissed: Date.now() }; savePrefMeta(); favVer++; }
// Favourites chosen before this feature existed have no mark: treat everything cached today as already reviewed.
function backfillPrefMeta() {
  let changed = false;
  const tids = new Set();
  for (const o of state.obs) if (o.fav) tids.add(String(o.tid));
  for (const tid of tids) {
    if (prefMeta[tid]) continue;
    const m = maxObsId(+tid);
    if (m) { prefMeta[tid] = { max: m, t: Date.now() }; changed = true; }
  }
  if (changed) { savePrefMeta(); favVer++; }
}
// An observation is a favourite if its owner faved it on iNaturalist.
const isFavObs = o => !!o.fav;
let faveTidSig = '', faveTids = new Map(); // tid → { id: its newest favourite observation, at: when a favourite of it was last chosen (ms, 0 if unknown) }
function hasFavTid(tid) {
  const sig = `${state.obs.length}|${favVer}`;
  if (sig !== faveTidSig) {
    faveTids = new Map();
    for (const o of state.obs) {
      if (!o.fav) continue;
      const e = faveTids.get(o.tid);
      if (!e) faveTids.set(o.tid, { id: o.id, at: o.favAt || 0 });
      else { if (o.id > e.id) e.id = o.id; if ((o.favAt || 0) > e.at) e.at = o.favAt; }
    }
    faveTidSig = sig;
  }
  return faveTids.has(tid);
}
// New = uploaded after the favourite was chosen. iNaturalist records when each fave was made, so this agrees on every device;
// "Keep my favourite" moves the baseline forward on this device. Observations whose upload time isn't known yet count as not new.
const isNewObs = o => {
  if (isOther() || !hasFavTid(o.tid)) return false;
  const f = faveTids.get(o.tid);
  if (o.id <= f.id) return false;
  const m = prefMeta[o.tid];
  if (f.at) return o.cr > Math.max(f.at, m?.dismissed || 0);
  return !!m && m.max !== undefined && o.id > Math.max(m.max, f.id); // no fave time yet (not synced): the older per-device mark
};
// Observations newer than a favourite need their upload time to be judged; older cached ones don't have it yet.
async function ensureCreated(token, ds = state) {
  hasFavTid(-1);
  const need = ds.obs.filter(o => !o.cr && faveTids.has(o.tid) && o.id > faveTids.get(o.tid).id).slice(0, 1000);
  if (!need.length) return 0;
  const times = new Map();
  for (let i = 0; i < need.length; i += 100) {
    const ids = need.slice(i, i + 100).map(o => o.id);
    const d = await api(`/observations?id=${ids.join(',')}&per_page=200`, token);
    for (const r of d.results) times.set(r.id, Date.parse(r.created_at) || 0);
    if (i + 100 < need.length) await sleep(700);
  }
  for (const o of need) o.cr = times.get(o.id) || -1; // -1: couldn't be read (deleted?); don't ask again
  favVer++;
  log(`upload times fetched for ${need.length} observations newer than a favourite`);
  return need.length;
}

// Toggle the iNaturalist fave of an observation (optimistic, reverted on failure; needs a login).
// onChange runs right after the optimistic update and again after a revert.
async function toggleFav(o, onChange = () => {}) {
  if (isOther()) { toast("Favourites can't be changed while viewing someone else's observations."); return false; }
  const want = !isFavObs(o);
  const token = $('token').value.trim().replace(/^Bearer\s+/i, '');
  if (!token) { // faves live on iNaturalist, so they need a login
    toast('Log in to favourite observations on iNaturalist.');
    setPanel(true);
    return false;
  }
  const prev = { fav: o.fav, favAt: o.favAt };
  o.fav = want; o.favAt = want ? Date.now() : 0;
  if (want) { prefMeta[o.tid] = { max: maxObsId(o.tid), t: Date.now() }; savePrefMeta(); }
  favVer++;
  onChange();
  try {
    try { await ensureFreshJwt(); } catch {}
    const t = $('token').value.trim().replace(/^Bearer\s+/i, '') || token;
    await api(`/observations/${o.id}/${want ? 'fave' : 'unfave'}`, t, { method: want ? 'POST' : 'DELETE' });
    log(`${want ? 'faved' : 'unfaved'} observation ${o.id} on iNaturalist`);
    saveCache();
    return true;
  } catch (e) {
    log(`fave update failed for ${o.id}: ${e.stack || e}`, 'e');
    o.fav = prev.fav; o.favAt = prev.favAt;
    favVer++; onChange();
    toast(`Couldn't update iNaturalist: ${e.message}`);
    return false;
  }
}
// Per-taxon stats: observation count, how many have photos, whether a favourite exists, how many are new.
function favStats() {
  const sig = `${state.obs.length}|${favVer}`;
  if (sig === favSig) return favCache;
  const m = new Map();
  for (const o of state.obs) {
    let s = m.get(o.tid);
    if (!s) m.set(o.tid, s = { n: 0, nPhoto: 0, hasFav: false, newN: 0 });
    s.n++;
    if (photosOf(o).length) s.nPhoto++;
    if (isFavObs(o)) s.hasFav = true;
    if (isNewObs(o)) s.newN++;
  }
  favSig = sig; favCache = m;
  return m;
}
const needsFav = s => !!s && s.nPhoto >= 2 && !s.hasFav;

// ---------- data cache (IndexedDB) ----------
const idb = {
  db: null,
  async open() {
    if (this.db) return this.db;
    this.db = await new Promise((res, rej) => {
      const r = indexedDB.open('inatviewer', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return this.db;
  },
  async get(k) {
    try {
      const db = await this.open();
      return await new Promise((res, rej) => {
        const r = db.transaction('kv').objectStore('kv').get(k);
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    } catch (e) { log(`IndexedDB get(${k}) failed: ${e}`, 'w'); return undefined; }
  },
  async set(k, v) {
    try {
      const db = await this.open();
      await new Promise((res, rej) => {
        const t = db.transaction('kv', 'readwrite');
        t.objectStore('kv').put(v, k);
        t.oncomplete = res; t.onerror = () => rej(t.error);
      });
    } catch (e) { log(`IndexedDB set(${k}) failed: ${e}`, 'w'); }
  },
  async keys() {
    try {
      const db = await this.open();
      return await new Promise((res, rej) => { const r = db.transaction('kv').objectStore('kv').getAllKeys(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    } catch (e) { log(`IndexedDB keys failed: ${e}`, 'w'); return []; }
  },
  async del(k) {
    try {
      const db = await this.open();
      await new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = res; t.onerror = () => rej(t.error); });
    } catch (e) { log(`IndexedDB del(${k}) failed: ${e}`, 'w'); }
  },
  async clear() {
    try {
      const db = await this.open();
      await new Promise((res, rej) => {
        const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').clear();
        t.oncomplete = res; t.onerror = () => rej(t.error);
      });
    } catch (e) { log('IndexedDB clear failed: ' + e, 'w'); }
  },
};

// ---------- whose observations are shown ----------
// A shared link looks like ?u=<login>&tab=… ; after the OAuth redirect the query is restored from sessionStorage.
let startSearch = location.search;
try { if (/[?&]code=/.test(startSearch)) startSearch = sessionStorage.getItem('inat_resume') || ''; } catch {}
const urlParams = new URLSearchParams(startSearch);
const lc = s => (s || '').toLowerCase();
let viewLogin = (urlParams.get('u') || '').trim();
let meLogin = ''; try { meLogin = localStorage.getItem('inat_me') || ''; } catch {}
let meId = 0; try { meId = +localStorage.getItem('inat_me_id') || 0; } catch {}
const setMe = me => { meLogin = me.login; meId = me.id; try { localStorage.setItem('inat_me', meLogin); localStorage.setItem('inat_me_id', String(meId)); } catch {} };
const isOther = () => !!viewLogin && lc(viewLogin) !== lc(meLogin); // true: read-only view of someone else
const dsKey = login => 'ds:' + lc(login);
// People whose observations are cached in this browser (metadata only), most recently viewed first.
let people = [];
const metaKey = login => 'dm:' + lc(login);
// My own observations while viewing someone else (used by Nearby's seen badges and as the default comparison partner).
let mine = { obs: [] };
// Comparison partners (any number): selected logins and their loaded observations.
let partners = [];
let cmpData = new Map(); // lc(login) → { login, obs, species: Set|null, sig }

// State = the dataset being viewed: user {id, login}, obs [slim records], complete (whole history loaded?), plus the shared taxon/place names.
let state = { user: null, obs: [], complete: true, total: null, names: {}, places: {}, updated: null };

async function loadCache() {
  const [names, places] = await Promise.all([idb.get('names'), idb.get('places')]);
  state.names = names || {}; state.places = places || {};
  // migrate the single-user cache of earlier versions into a per-user dataset
  const [lu, lo, lupd] = await Promise.all(['user', 'obs', 'updated'].map(k => idb.get(k)));
  if (lu && lo) {
    if (!(await idb.get(dsKey(lu.login)))) await idb.set(dsKey(lu.login), { user: lu, obs: lo, complete: true, updated: lupd });
    if (!meLogin) { meLogin = lu.login; try { localStorage.setItem('inat_me', meLogin); } catch {} }
    await Promise.all(['user', 'obs', 'updated'].map(k => idb.del(k)));
    log(`migrated cache to per-user storage for ${lu.login}`);
  }
  const target = viewLogin || meLogin;
  if (target) {
    const ds = await idb.get(dsKey(target));
    if (ds) Object.assign(state, { user: ds.user, obs: ds.obs || [], complete: ds.complete !== false, total: ds.total ?? null, updated: ds.updated, edited: ds.edited, idsChecked: ds.idsChecked });
    else state.user = { id: null, login: target };
  }
  rarity = (await idb.get('rarity')) || {};
  await loadPeople();
  await touchViewed(state.user?.login || target);
  await loadCompare();
  log(`cache: ${state.obs.length} observations for ${state.user?.login || '(nobody yet)'}, ${Object.keys(state.names).length} taxa` +
      (state.updated ? `, saved ${state.updated}` : ' (empty)') + (partners.length ? `; comparing with ${partners.join(', ')}` : ''));
}
// Which people are cached (from small metadata records; built once for caches that predate them).
async function loadPeople() {
  const keys = await idb.keys();
  const dsKeys = keys.filter(k => typeof k === 'string' && k.startsWith('ds:'));
  const out = [];
  for (const k of dsKeys) {
    let m = await idb.get('dm:' + k.slice(3));
    if (!m) {
      const ds = await idb.get(k);
      if (!ds) continue;
      m = { login: ds.user?.login || k.slice(3), count: (ds.obs || []).length, complete: ds.complete !== false, total: ds.total ?? null, updated: ds.updated || null, viewedAt: 0 };
      await idb.set('dm:' + k.slice(3), m);
    }
    out.push(m);
  }
  people = out.sort((a, b) => (b.viewedAt || 0) - (a.viewedAt || 0));
}
async function touchViewed(login) {
  if (!login) return;
  const m = (await idb.get(metaKey(login))) || null;
  if (m) { m.viewedAt = Date.now(); await idb.set(metaKey(login), m); }
}
const myName = l => lc(l) === lc(meLogin) ? 'me' : '@' + l;
// Everyone who could be a comparison partner for the dataset on screen.
function candidates() {
  const self = lc(state.user?.login || viewLogin || meLogin), seen = new Set(), out = [];
  for (const l of [meLogin, ...people.map(p => p.login)]) { if (l && lc(l) !== self && !seen.has(lc(l))) { seen.add(lc(l)); out.push(l); } }
  return out;
}
// Load the selected partners' cached observations (never fetches).
async function loadCompare() {
  const self = lc(state.user?.login || viewLogin || meLogin);
  mine = { obs: [] };
  if (isOther() && meLogin) mine.obs = (await idb.get(dsKey(meLogin)))?.obs || [];
  let sel = null;
  try { const s = JSON.parse(localStorage.getItem('inat_partners') || 'null'); if (Array.isArray(s)) sel = s; } catch {}
  if (!sel) sel = isOther() ? (meLogin ? [meLogin] : []) : (people.find(p => lc(p.login) !== lc(meLogin) && lc(p.login) !== self)?.login ? [people.find(p => lc(p.login) !== lc(meLogin) && lc(p.login) !== self).login] : []);
  partners = sel.filter(l => l && lc(l) !== self);
  cmpData = new Map();
  for (const l of partners) cmpData.set(lc(l), { login: l, obs: (await idb.get(dsKey(l)))?.obs || [], species: null, sig: '' });
}
async function saveDataset(ds = state) {
  ds.updated = new Date().toISOString();
  const jobs = [idb.set('names', state.names), idb.set('places', state.places)];
  if (ds.user?.login) {
    jobs.push(idb.set(dsKey(ds.user.login), { user: ds.user, obs: ds.obs, complete: ds.complete, total: ds.total, updated: ds.updated, edited: ds.edited, idsChecked: ds.idsChecked }));
    const prev = people.find(p => lc(p.login) === lc(ds.user.login));
    const meta = { login: ds.user.login, count: ds.obs.length, complete: ds.complete !== false, total: ds.total ?? null, updated: ds.updated, viewedAt: prev?.viewedAt || Date.now() };
    if (prev) Object.assign(prev, meta); else people.unshift(meta);
    jobs.push(idb.set(metaKey(ds.user.login), meta));
  }
  await Promise.all(jobs);
  log(`cache saved (${ds.user?.login || '?'}: ${ds.obs.length} obs, ${Object.keys(state.names).length} taxa)`);
}
const saveCache = () => saveDataset(state);

function status(msg, err) {

  $('status').textContent = msg;
  $('status').className = 'status' + (err ? ' error' : '');
  if (err) setPanel(true); // surface the account/sync controls when something needs attention
}

  $('login').hidden = !open; $('loginbg').hidden = !open;
  $('acct').setAttribute('aria-expanded', String(open));
  if (open && typeof renderPeople === 'function') renderPeople();

$('covername').onclick = $('coverava').onclick = () => setPanel(true);

// ---------- API ----------
const apiStats = { limited: 0 }; // how many times iNaturalist has answered 429 (too many requests)
async function api(path, token, opts = {}) {
  const url = API + path, method = opts.method || 'GET';
  const mask = token ? ` [auth ${token.slice(0, 6)}…(${token.length} chars)]` : ' [no auth]';
  for (let attempt = 1; attempt <= 3; attempt++) {
    const t0 = performance.now();
    log(`${method} ${url}${mask} (attempt ${attempt})`);
    let res;
    try {
      res = await fetch(url, { method, headers: token ? { Authorization: token } : {} });
    } catch (e) {
      log(`NETWORK ERROR after ${Math.round(performance.now() - t0)}ms: ${e.name}: ${e.message}`, 'e');
      log(`  navigator.onLine=${navigator.onLine}, page origin=${location.origin}, protocol=${location.protocol}`, 'e');
      log('  "Failed to fetch" means the browser never got a response: offline, DNS/proxy/firewall block, ' +
          'ad/privacy blocker, or CORS rejection (see browser DevTools → Network/Console for the exact reason).', 'e');
      if (attempt < 3) { await sleep(1000 * attempt); continue; }
      throw new Error(`Network error talking to iNaturalist (${e.message}). See the debug log below.`);
    }
    const ms = Math.round(performance.now() - t0);
    log(`  → ${res.status} ${res.statusText} in ${ms}ms` +
        ` (rate-limit-remaining=${res.headers.get('x-ratelimit-remaining') ?? 'n/a'})`);
    if (res.ok) { const txt = await res.text(); try { return txt ? JSON.parse(txt) : {}; } catch { return {}; } }
    const body = (await res.text().catch(() => '')).slice(0, 300);
    log(`  body: ${body}`, 'e');
    if (res.status === 401 || res.status === 403) throw new Error('Your sign-in has expired. Please sign in again.');
    if (res.status === 429) apiStats.limited++;
    if (res.status === 429 || res.status >= 500) {
      if (attempt < 3) { log(`  retrying in ${2 * attempt}s`, 'w'); await sleep(2000 * attempt); continue; }
    }
    throw new Error(`iNaturalist API error ${res.status}`);
  }
}

// Reduce a full API observation to what we need.
// Thumbnail for a species: one of the observations its owner has faved on iNaturalist (random, stable for this page load),
// else the newest with a photo.
const thumbSeed = Math.floor(Math.random() * 2 ** 31);
function thumbObs(list) {
  const withPhoto = list.filter(o => photosOf(o).length);
  if (!withPhoto.length) return list[0];
  const faves = withPhoto.filter(o => o.fav);
  if (faves.length) return faves[shuffleKey(list[0].tid, thumbSeed) % faves.length];
  return withPhoto.reduce((a, b) => (b.id > a.id ? b : a));
}
function slim(o) {
  const t = o.taxon;
  return {
    id: o.id,
    tid: t.id,
    anc: t.ancestor_ids,
    name: t.name,
    common: t.preferred_common_name || '',
    date: o.observed_on || '',
    loc: o.location || '',
    pids: o.place_ids || [],
    // iNaturalist "fave" by the observation's own owner (undefined when the payload carried no fave info)
    fav: Array.isArray(o.faves) ? o.faves.some(f => (f.user?.id ?? f.user_id) === o.user?.id) : undefined,
    ff: Array.isArray(o.faves) ? o.faves.filter(f => (f.user?.id ?? f.user_id) !== o.user?.id).length : undefined, // faves by other people
    mf: meId && Array.isArray(o.faves) ? o.faves.some(f => (f.user?.id ?? f.user_id) === meId) : undefined, // faved by the person using the app (matters on someone else's account)
    cr: Date.parse(o.created_at) || 0, // when it was uploaded (ms); compared with the time a favourite was chosen
    photos: (o.photos || []).map(p => p.url).filter(Boolean),
    photo: o.photos?.[0]?.url || t.default_photo?.square_url || '',
  };
}

// Newer observations first-in-id order after afterId (also used for the very first full load of my own account).
let skippedUnidentified = 0; // observations iNaturalist returned that have no identification, so the viewer cannot place them in the tree
async function fetchNewObservations(token, userParam, afterId, ds = state) {
  const fresh = []; // also appended to ds.obs and saved after every page
  let lastId = afterId, total = null, skipped = 0;
  for (;;) {
    const d = await api(`/observations?user_id=${userParam}&per_page=200&order_by=id&order=asc&id_above=${lastId}`, token);
    if (total === null) total = d.total_results;
    if (!d.results.length) break;
    if (!ds.user?.id && d.results[0].user) ds.user = { id: d.results[0].user.id, login: d.results[0].user.login };
    const page = [];
    for (const o of d.results) {
      if (o.taxon?.ancestor_ids?.length) page.push(slim(o)); else { skipped++; skippedUnidentified++; }
    }
    fresh.push(...page);
    ds.obs.push(...page);
    lastId = d.results[d.results.length - 1].id;
    await saveDataset(ds); // resume point: next run continues from the highest cached id
    if (ds === state && (!$('results').hidden || fresh.length === page.length)) show();
    status(`Fetched ${fresh.length + skipped} of ${total} new observations…`);
    if (d.results.length < 200) break;
    await sleep(700);
  }
  log(`fetched ${fresh.length} new identified observations (${skipped} unidentified skipped)`);
  return fresh;
}

// Faves are only read when an observation is first downloaded, so a fave added or removed elsewhere (another device,
// the website) never reaches the cache. Re-read them from the observations that have any faves ("popular"), newest first.
const FAVE_SCAN_CAP = 15; // pages of 200; a normal account has far fewer faved observations than that
let lastFaveSync = 0, faveShapeLogged = false;
async function syncFaves(token, userParam, ds = state) {
  const owner = ds.user?.id;
  if (!owner || !ds.obs.length) return 0;
  const faved = new Map(); // observation id → when the owner faved it (ms)
  const others = new Map(); // observation id → number of faves by other people
  const mineFaved = new Set(); // observations the person using the app has faved (someone else's account)
  let lastId = 0, scannedTo = 0, pages = 0, seenPopular = 0;
  for (;;) {
    const d = await api(`/observations?user_id=${userParam}&popular=true&per_page=200&order_by=id&order=desc` + (lastId ? `&id_below=${lastId}` : ''), token);
    seenPopular += d.results.length;
    if (!faveShapeLogged) { // what does a fave record carry (is there a timestamp)?
      const f = d.results.flatMap(o => o.faves || []).find(x => (x.user?.id ?? x.user_id) === owner);
      if (f) { faveShapeLogged = true; const { user, ...rest } = f; log(`fave record fields: ${Object.keys(f).join(', ')}; user fields: ${Object.keys(user || {}).join(', ')}; sample (without user): ${JSON.stringify(rest).slice(0, 300)}`); }
    }
    for (const o of d.results) {
      const f = Array.isArray(o.faves) ? o.faves.find(x => (x.user?.id ?? x.user_id) === owner) : null;
      if (f) faved.set(o.id, Date.parse(f.created_at) || 0);
      if (meId && Array.isArray(o.faves) && o.faves.some(x => (x.user?.id ?? x.user_id) === meId)) mineFaved.add(o.id);
      if (Array.isArray(o.faves)) others.set(o.id, o.faves.filter(x => (x.user?.id ?? x.user_id) !== owner).length);
    }
    pages++;
    if (!d.results.length || d.results.length < 200) { scannedTo = 0; break; } // reached the end of the list
    lastId = d.results[d.results.length - 1].id;
    if (pages >= FAVE_SCAN_CAP) { scannedTo = lastId; break; } // partial scan: don't clear faves below this id
    await sleep(700);
  }
  const before = ds.obs.filter(o => o.fav).length;
  let added = 0, removed = 0;
  let timed = 0;
  for (const o of ds.obs) {
    const now = faved.has(o.id);
    if (!now && scannedTo && o.id < scannedTo) continue;
    if (!scannedTo || o.id >= scannedTo) {
      const ff = others.get(o.id) || 0; if ((o.ff || 0) !== ff) { o.ff = ff; timed++; }
      if (meId && owner !== meId) { const mf = mineFaved.has(o.id); if (!!o.mf !== mf) { o.mf = mf; timed++; } }
    }
    if (now && (o.favAt || 0) !== faved.get(o.id)) { o.favAt = faved.get(o.id); timed++; } else if (!now && o.favAt) { o.favAt = 0; timed++; }
    if (o.fav === now) continue;
    if (now) { added++; prefMeta[o.tid] = { max: maxObsId(o.tid), t: Date.now() }; } else if (o.fav) removed++;
    o.fav = now;
  }
  lastFaveSync = Date.now();
  if (added) savePrefMeta();
  log(`fave sync: ${pages} page(s), ${seenPopular} observations with faves, ${faved.size} faved by owner; cached faves ${before} → ${ds.obs.filter(o => o.fav).length} (+${added} −${removed})${scannedTo ? `; partial scan down to id ${scannedTo}` : ''}`);
  if (added || removed || timed) favVer++;
  return added + removed;
}

// Observations are only downloaded once, so edits made on iNaturalist (a refined identification, a corrected date or place,
// different photos) never reached the cache. Fetch what changed since the last check and replace those records.
const EDIT_SCAN_PAGES = 25; // x200; the first check looks back 90 days
async function syncEdits(token, userParam, ds = state) {
  if (!ds.obs.length) return 0;
  const started = new Date().toISOString();
  const since = new Date(new Date(ds.edited || Date.now() - 90 * 864e5) - 5 * 60e3).toISOString(); // a little overlap for clock differences
  const byId = new Map(ds.obs.map(o => [o.id, o]));
  const maxCached = ds.obs.reduce((m, o) => Math.max(m, o.id), 0);
  let lastId = 0, pages = 0, changed = 0, added = 0, removed = 0, seen = 0;
  const gone = new Set();
  for (;;) {

  const ids = new Set();

    const d = await api(`/observations?user_id=${userParam}&only_id=true&per_page=200&order_by=id&order=desc` + (lastId ? `&id_below=${lastId}` : ''), token);
    for (const o of d.results) ids.add(o.id);

function buildTree(obs, chainOf = o => o.anc.slice(0, -1)) {
  const root = { id: 0, children: new Map(), species: [], count: 0 };
  for (const o of obs) {
    let node = root;
    node.count++;
    for (const id of chainOf(o)) {
      if (!node.children.has(id)) node.children.set(id, { id, children: new Map(), species: [], count: 0 });
      node = node.children.get(id);
      node.count++;
    }
    node.species.push(o);
  }
  return root;
}

  list = list.filter(o => photosOf(o).length); // the gallery is photos only

  addTag(mc ? `${who} ${isOther() ? 'has' : 'have'} ${mc} observation${mc > 1 ? 's' : ''}` : `✗ Not yet seen by ${isOther() ? who : 'you'}`);
  for (const p of activePartners()) {
    const n = p.obs.filter(o => o.tid === id || o.anc.includes(id)).length;
    addTag(n ? `${myName(p.login) === 'me' ? 'You have' : `@${p.login} has`} ${n}` : `✗ Not seen by ${myName(p.login) === 'me' ? 'you' : '@' + p.login}`);
  }
  form.append(tags);
  // conservation status: from the species data, or from the rarity lookup if that is all we have
  const cs = t?.status?.name ? t.status : (rarity[id]?.st ? { name: rarity[id].st, iucn: rarity[id].iucn, code: rarity[id].code || '', authority: rarity[id].auth || '', place: rarity[id].place || '' } : null);
  if (cs) {
    const IUCN = { 5: 'Data deficient', 10: 'Least concern', 20: 'Near threatened', 30: 'Vulnerable', 40: 'Endangered', 50: 'Critically endangered', 60: 'Extinct in the wild', 70: 'Extinct' };
    const lvl = cs.iucn >= 50 ? 'crit' : cs.iucn >= 30 ? 'threat' : cs.iucn >= 20 ? 'near' : cs.iucn >= 10 ? 'ok' : 'unk';
    const row = el('div', 'cons ' + lvl);
    row.insertAdjacentHTML('beforeend', ic(lvl === 'ok' ? 'shield-check' : 'shield-alert', 18));
    const txt = el('div');
    const title = (IUCN[cs.iucn] || cs.name || 'Conservation status').replace(/^./, c => c.toUpperCase());
    txt.append(el('strong', '', title + (cs.code ? ` (${cs.code})` : '')));
    const sub = [cs.authority || 'Conservation status', cs.place ? `in ${cs.place}` : (cs.authority ? 'global' : '')].filter(Boolean).join(' · ');
    txt.append(el('div', 'status', sub));
    row.append(txt);
    form.append(row);
  }
  const dstats = favStats().get(id);
  if (dstats && dstats.newN > 0) {
    banner = el('div', 'banner');
    banner.insertAdjacentHTML('beforeend', ic('refresh-cw', 16));
    banner.append(` ${dstats.newN} new observation${dstats.newN > 1 ? 's' : ''} since you chose your favourite. `);
    const keep = el('button', 'secondary', 'Keep my favourite'); keep.type = 'button';
    keep.onclick = () => { dismissNew(id); banner.remove(); mineGrid?.querySelectorAll('.newtag').forEach(x => x.remove()); show(true); };
    banner.append(keep);
    desc.before(banner);
  } else if (needsFav(dstats) && !isOther()) { // the "no favourite yet" prompt only makes sense for my own observations
    banner = el('div', 'banner'); banner.insertAdjacentHTML('beforeend', ic('star', 16)); banner.append(' No favourite chosen yet. Tap the star on a photo below to pick one.');
    desc.before(banner);
  }
  if (err) left.append(Object.assign(el('p', 'status error', `Could not load details: ${err}`)));

  if (t?.ancestors?.length) {
    const cr = el('div', 'crumbs');
    t.ancestors.filter(a => a.rank !== 'stateofmatter').forEach((a, i) => {
      if (i) cr.append(' › ');
      const b = el('button', '', a.common || a.name); b.type = 'button'; b.title = a.rank;
      b.onclick = () => openSpecies(a.id);
      cr.append(b);
    });
    field('Classification', '').append(cr);
  }

  if (t?.wiki) {
    desc.append(el('p', '', t.wiki.length > 700 ? t.wiki.slice(0, 700).replace(/\s+\S*$/, '') + '…' : t.wiki));
    if (t.wikiUrl) { const a = el('a', 'withicon', 'Read on Wikipedia '); a.insertAdjacentHTML('beforeend', ic('external-link', 14)); a.href = t.wikiUrl; a.target = '_blank'; a.rel = 'noopener'; desc.append(a); }
  } else if (t && !err) {
    desc.append(el('p', '', 'No Wikipedia summary is linked to this taxon on iNaturalist.'));
  }

  // my observations
  if (mineObs.length) {
    const dates = mineObs.map(o => o.date).filter(Boolean).sort();
    right.append(el('h3', '', `My observations (${mineObs.length})`));
    if (dates.length) right.append(el('p', 'status', `First ${dates[0]} · Latest ${dates[dates.length - 1]}`));
    const grid = el('div', 'mine'); mineGrid = grid;
    for (const o of [...mineObs].sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.id - a.id)) {
      const ph = photosOf(o);
      const cell = el('div', 'alt'); cell.dataset.obs = o.id;
      if (focus && o.id === focus.id) cell.classList.add('sel');
      const pic = el('button', 'pic'); pic.type = 'button'; pic.title = 'Show in the carousel above';
      if (ph.length) {
        const im = el('img'); im.src = sized(ph[0], 'medium'); im.alt = ''; im.loading = 'lazy'; pic.append(im);
        pic.onclick = () => selectObs(o);
      }
      const st = el('button', 'ib star'); setIcon(st, 'star', 16, isFavObs(o)); st.type = 'button'; st.title = 'Favourite on iNaturalist'; st.hidden = isOther();
      st.onclick = () => starTap(o);
      cell.append(pic, st, obsLink(o, 'ib ext'));
      if (isNewObs(o)) cell.append(el('span', 'newtag', 'NEW'));
      if (o.fav) { const ft = el('span', 'favtag'); ft.title = 'Favourited on iNaturalist'; ft.innerHTML = ic('heart', 14, true); cell.append(ft); }
      if (o.date) { const d = el('span', 'badge', o.date); d.style.left = '4px'; d.style.right = 'auto'; cell.append(d); }
      grid.append(cell);
    }
    right.append(grid);
  }

  // seasonality (global, from iNaturalist) with my months marked
  const seasonBox = el('div'); right.append(seasonBox);
  api(`/observations/histogram?taxon_id=${id}&date_field=observed&interval=month_of_year`).then(d => {
    if (!detail.isOpen) return;
    const m = d.results?.month_of_year || {};
    const vals = Array.from({ length: 12 }, (_, i) => m[i + 1] || 0), max = Math.max(1, ...vals);
    if (!vals.some(Boolean)) return;
    const mineMonths = new Set(mineObs.map(o => parseInt((o.date || '').slice(5, 7), 10)).filter(Boolean));
    seasonBox.append(el('h3', '', 'When it is seen'));
    const bars = el('div', 'season'), labels = el('div', 'season-l');
    vals.forEach((v, i) => {
      const b = el('div'); b.style.height = `${Math.max(3, v / max * 100)}%`; b.title = `${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][i]}: ${v.toLocaleString()}`;
      bars.append(b);
      labels.append(el('span', mineMonths.has(i + 1) ? 'me' : '', 'JFMAMJJASOND'[i]));
    });
    seasonBox.append(bars, labels);
    if (mineMonths.size) seasonBox.append(el('p', 'status', 'Red letters: months you have seen it.'));
  }).catch(e => log(`histogram failed: ${e.message}`, 'w'));

  // map: my observations, plus an optional iNaturalist observation heat layer as a rough range
  const pts = mineObs.map(parseLoc).filter(Boolean);
  const mapBox = el('div', 'nbmap'); right.append(mapBox);
  mapBox.append(el('h3', '', 'Where it is seen'));
  mapBox.append(el('p', 'status', 'Orange dots are your observations; the heat layer shows all iNaturalist observations (approximate range).'));
  const mapDiv = el('div'); mapDiv.id = 'dmap'; mapDiv.style.marginTop = '8px'; mapBox.append(mapDiv);
  try { await ensureLeaflet(); } catch (e) { mapBox.append(el('p', 'status error', 'Map failed to load.')); return; }
  if (!detail.isOpen || !mapDiv.isConnected) return;
  const m = L.map(mapDiv, { worldCopyJump: true, preferCanvas: true, zoomControl: false }); L.control.zoom({ position: 'topright' }).addTo(m); addDoubleTapZoom(m);
  L.tileLayer(TILE_TEMPLATE, { maxZoom: 19, attribution: TILE_ATTR, keepBuffer: 6 }).addTo(m);
  const heat = L.tileLayer(`https://api.inaturalist.org/v1/colored_heatmap/{z}/{x}/{y}.png?taxon_id=${id}`, { opacity: 0.7, maxNativeZoom: 12 });
  heat.addTo(m);
  heat.on('tileerror', () => log(`range overlay tile failed for taxon ${id}`, 'w'));
  const dots = [];
  for (const o of mineObs) {
    const ll = parseLoc(o);
    if (!ll) continue;
    dots.push(L.circleMarker(ll, { radius: 9, color: '#fff', weight: 2.5, fillColor: '#c8453b', fillOpacity: 1, bubblingMouseEvents: false })
      .bindPopup(() => obsPopup(o), { minWidth: 200 }).addTo(m));
  }
  m.on('click', e => nearbyPopup(m, e.latlng, id));
  // Frame the region where the species is observed: first my own dots, then (once iNaturalist answers)
  // the extent of all its observations plus my dots, unless the user has already moved the map.
  let touched = false;
  for (const ev of ['mousedown', 'touchstart', 'wheel']) mapDiv.addEventListener(ev, () => { touched = true; }, { passive: true });
  const fit = (bounds, maxZoom) => { m.invalidateSize(); m.fitBounds(bounds, { maxZoom, animate: false, padding: [20, 20] }); };
  const searchArea = view === 'explore' ? nearbyAreaLayer() : null; // opened from Nearby: frame the area that was searched
  if (searchArea) { searchArea.layer.addTo(m); touched = true; fit(searchArea.bounds.pad(0.05), 14); }
  else if (pts.length) fit(L.latLngBounds(pts).pad(0.2), 11); else m.setView([20, 0], 2);
  api(`/observations?taxon_id=${id}&per_page=1&return_bounds=true`).then(d => {
    const b = d.total_bounds;
    log(`range bounds for taxon ${id}: ${b ? JSON.stringify(b) : 'none returned'}`);
    if (touched || !detail.isOpen || !b || ![b.swlat, b.swlng, b.nelat, b.nelng].every(Number.isFinite)) return;
    const all = L.latLngBounds([[b.swlat, b.swlng], [b.nelat, b.nelng]]);
    pts.forEach(p => all.extend(p));
    fit(all.pad(0.05), 8);
  }).catch(e => log(`range bounds lookup failed: ${e.message}`, 'w'));
  setTimeout(() => m.invalidateSize(), 50);
}

// ---------- open iNaturalist links in the Android app ----------
// Plain https links stay in the browser on some Android setups; an intent: URL asks Android to open the app,
// and falls back to the normal web page if the app isn't installed.
const IS_ANDROID = /Android/i.test(navigator.userAgent);
function androidIntent(href) {
  const m = /^https:\/\/www\.inaturalist\.org\/(observations|taxa)\/(\d+)/.exec(href);
  if (!m) return null;
  return `intent://www.inaturalist.org/${m[1]}/${m[2]}#Intent;scheme=https;package=org.inaturalist.android;` +
         `S.browser_fallback_url=${encodeURIComponent(href)};end`;
}
document.addEventListener('click', e => {
  if (!IS_ANDROID || e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
  const a = e.target.closest && e.target.closest('a[href]');
  if (a && a.dataset.inpage) return; // species names open the in-page detail panel
  const intent = a && androidIntent(a.href);
  if (!intent) return;
  e.preventDefault();
  log(`opening in the iNaturalist app: ${a.href}`);
  location.href = intent;
}, true); // capture phase: some containers (map popups etc.) stop click propagation

// ---------- Common: the most observed species inside the Location circle, and whether I've seen them ----------
const explore = { items: [], total: 0, page: 0, loading: false, err: '', seq: 0, fkey: '', cachedAt: null };
const exploreResearch = true; // Nearby counts research-grade observations only
let exploreHideSeen = false;
try { exploreHideSeen = localStorage.getItem('inat_common_hide') === '1'; } catch {}

function speciesIdOf(o) {
  if (state.names[o.tid]?.rank === 'species') return o.tid;
  return o.anc.find(id => state.names[id]?.rank === 'species') || null;
}
// "Mine" for Nearby's seen/not-seen badges: the logged-in user's observations (the comparison dataset while viewing someone else).
const myObs = () => state.obs; // whoever is being viewed: their photos and ticks (when it is someone else, that is their observations, not mine)
function mySpeciesCounts() {
  const m = new Map();
  for (const o of myObs()) { const id = speciesIdOf(o) ?? o.tid; m.set(id, (m.get(id) || 0) + 1); }
  return m;
}
// My preferred photo for each species id: the starred observation if there is one, else the first with a photo.
function myPhotoBySpecies() {
  const bySpecies = new Map();
  for (const o of myObs()) {
    const id = speciesIdOf(o) ?? o.tid;
    if (!bySpecies.has(id)) bySpecies.set(id, []);
    bySpecies.get(id).push(o);
  }
  const m = new Map();
  for (const [id, list] of bySpecies) {
    const pick = thumbObs(list), ph = photosOf(pick)[0];
    if (ph) m.set(id, { url: ph, starred: !!pick.fav });
  }
  return m;
}
// iNaturalist's species list is searched by radius; very wide circles are cut to the nearest 100 km.
const exploreKm = () => Math.min(100, Math.max(0.1, area.r / 1000));
// Switching to Common with no area chosen: start around where I am (10 km); if that is not possible, open the Location sheet to pick a place.
let geoBusy = false, commonTemp = false; // commonTemp: the circle exists only because Common needs one
function useMyLocationForCommon() {
  commonTemp = true;
  if (!navigator.geolocation || geoBusy) { if (!geoBusy) { commonTemp = false; renderExplore(); } return; } // no location: Nearby shows its Choose a location button
  geoBusy = true; renderExplore();
  navigator.geolocation.getCurrentPosition(pos => {
    geoBusy = false;
    log(`geolocation: ${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)} (±${Math.round(pos.coords.accuracy)} m)`);
    if (area || view !== 'explore') { renderExplore(); return; }
    $('follow').checked = true; areaFitted = false;
    setArea({ lat: pos.coords.latitude, lng: pos.coords.longitude, r: 10000 });
    if (areaMap) moveMap(() => areaMap.fitBounds(L.latLng(area.lat, area.lng).toBounds(area.r * 2), { animate: false }));
  }, err => {
    geoBusy = false; commonTemp = false;
    log(`geolocation error ${err.code}: ${err.message}`, 'w');
    renderExplore(); // the Choose a location button is shown
  }, { timeout: 12000, maximumAge: 120000 });
}
// Open Common around where an observation was made.
async function exploreFromObs(o) {
  const ll = parseLoc(o);
  if (!ll) { status('That observation has no location.', true); return; }
  $('follow').checked = true; areaFitted = false;
  setArea({ lat: ll[0], lng: ll[1], r: 10000 });
  setView('explore');
}
// The circle as a layer for another map (the species page frames the area that was searched).
function nearbyAreaLayer() {
  if (!area) return null;
  const layer = L.polyline(inkRingPoints(area.lat, area.lng, area.r), INK_RING);
  return { layer, bounds: L.latLng(area.lat, area.lng).toBounds(area.r * 2) };
}

// ---- recent searches kept in IndexedDB, so a search shows again (also offline) ----
const SEARCH_MAX = 15, SEARCH_ITEMS = 300;
const expFilterKey = () => `${area ? `${area.lat.toFixed(3)},${area.lng.toFixed(3)},${Math.round(area.r)}` : ''}|${dateRange()}|${[...filterClasses].sort().join()}|${exploreResearch}`;
async function loadSearches() { return (await idb.get('nearby')) || []; }
async function saveSearch() {
  if (!area || !explore.items.length) return;
  const e = { id: expFilterKey(), t: explore.cachedAt || Date.now(), total: explore.total,
    items: explore.items.slice(0, SEARCH_ITEMS).map(it => ({ count: it.count, taxon: { id: it.taxon.id, name: it.taxon.name, preferred_common_name: it.taxon.preferred_common_name, default_photo: { medium_url: it.taxon.default_photo?.medium_url, square_url: it.taxon.default_photo?.square_url } } })) };
  const list = (await loadSearches()).filter(x => x.id !== e.id);
  list.unshift(e);
  await idb.set('nearby', list.slice(0, SEARCH_MAX));
}
async function findSearch(key) { return (await loadSearches()).find(x => x.id === key); }

async function loadExplore(more = false) {
  if (!area) return renderExplore();
  const seq = ++explore.seq;
  if (!more) Object.assign(explore, { items: [], total: 0, page: 0, err: '', fkey: expFilterKey(), cachedAt: null });
  explore.loading = true; renderExplore();
  try {
    const q = new URLSearchParams({ per_page: 100, page: explore.page + 1, lat: area.lat.toFixed(5), lng: area.lng.toFixed(5), radius: exploreKm().toFixed(2) });
    if (exploreResearch) q.set('quality_grade', 'research');
    if (filterClasses.size) q.set('iconic_taxa', [...filterClasses].join(','));
    const dr = dateRange(); // the shared date filter
    if (dr) { if (dr[0] > '0001') q.set('d1', dr[0]); if (dr[1] < '9999') q.set('d2', dr[1]); }
    if (!navigator.onLine) throw new Error('You are offline');
    const d = await api(`/observations/species_counts?${q}`);
    if (seq !== explore.seq) return; // the area changed while loading
    explore.items.push(...d.results); explore.total = d.total_results; explore.page++;
    saveSearch();
  } catch (e) {
    if (seq !== explore.seq) return;
    log(`species_counts failed: ${e.stack || e}`, 'e'); explore.err = e.message;
    if (!more) { // offline or failing: fall back to the saved copy of this search, if there is one
      const hit = await findSearch(expFilterKey());
      if (seq !== explore.seq) return;
      if (hit) Object.assign(explore, { items: hit.items, total: hit.total, page: Math.ceil(hit.items.length / 100), err: '', cachedAt: hit.t });
    }
  } finally {
    if (seq === explore.seq) { explore.loading = false; renderExplore(); }
  }
}

function renderExplore() {
  const host = $('gal');
  const draw = nodes => { // Common draws into the gallery
    if (view !== 'explore') return;
    Object.assign(gal, { items: [], groups: [], cells: [], drawnSort: '' }); $('pathbar').hidden = true;
    host.replaceChildren(...nodes.filter(Boolean));
    renderWelcome(); layoutStage();
  };
  const para = text => { $('summary').textContent = text; return null; }; // Common's note is written on the cover with the other totals
  $('expmore').hidden = true; $('exprefresh').hidden = true;
  if (!area && geoBusy) { draw([para('Finding your location…')]); return; }
  if (!area) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Choose a location'; b.style.margin = '0 14px'; b.onclick = () => $('areabtn').click();
    draw([para("Your location couldn't be found. Choose a place on the map to see the most observed species there."), b]);
    return;
  }
  const mine = mySpeciesCounts(), myPhoto = myPhotoBySpecies();
  const act = activePartners(); // the viewed person's photo is the first one; each person being compared sits beside it
  const rows = explore.items.filter(it => {
    if (exploreHideSeen && mine.has(it.taxon.id)) return false;
    if (act.length && !act.every(p => { const m = pmode(p); return m === 'off' || (m === 'seen') === partnerSpecies(p).has(it.taxon.id); })) return false;
    return true;
  });
  const seenN = explore.items.filter(it => mine.has(it.taxon.id)).length;
  const where = `within ${fmtDist(Math.min(area.r, 100000))}${area.r > 100000 ? ' (the nearest 100 km)' : ''}`;
  const note = explore.err && !explore.items.length ? explore.err
    : explore.loading && !explore.items.length ? `Loading species ${where}…`
    : `${explore.total.toLocaleString()} species ${where}. You've seen ${seenN} of the top ${explore.items.length} shown.` +
      (explore.cachedAt ? ` Saved ${ago(new Date(explore.cachedAt).toISOString())}.` : '') +
      (myObs().length ? '' : ' (Load observations to see which you have seen.)');
  if (!rows.length) {
    draw([para(explore.err ? explore.err : explore.loading ? note : explore.items.length ? 'Nothing to show for this filter.' : `No species found ${where}.`)]);
  } else {
    const grid = document.createElement('div'); grid.className = 'pgrid top';
    for (const it of rows) { const cell = document.createElement('div'); cell.className = 'cell'; cell.append(commonTile(it, mine, myPhoto, act)); grid.append(cell); }
    draw([para(note), ...oneFolder(grid)]);
  }
  if (!explore.loading && !geoBusy) finishBm();
  $('exprefresh').hidden = !explore.cachedAt || explore.loading;
  $('expmore').hidden = explore.loading || explore.items.length >= explore.total;
  $('expmore').textContent = `Show more (${explore.total - explore.items.length} left)`;
}
// One Polaroid for a species in Common: my own favourite photo if I have one, otherwise iNaturalist's; a green tick when I have seen it.
function commonTile(it, mine, myPhoto, act = []) {
  const t = it.taxon, n = mine.get(t.id), mp = myPhoto.get(t.id);
  const tile = document.createElement('div'); tile.className = 'tile'; markBrow(tile, t.id);
  tile.style.setProperty('--rot', ((Math.imul(t.id, 2654435761) >>> 0) % 1300 / 100 - 6.5).toFixed(2) + 'deg');
  tile.title = `${t.preferred_common_name || t.name} · ${it.count.toLocaleString()} observations here${n ? ` · you have seen it (${n})` : ''}`;
  const b = document.createElement('button'); b.type = 'button'; b.className = 'pic'; b.setAttribute('aria-label', 'Open species');
  const src = mp ? sized(mp.url, 'medium') : (t.default_photo?.medium_url || t.default_photo?.square_url || '');
  if (src) {
    const im = document.createElement('img'); im.alt = ''; im.loading = 'lazy'; im.src = src; if (!n) im.classList.add('mutedimg');
    // a species I have not seen shows iNaturalist's photo, muted, as a small postage stamp (and is not marked with my picture)
    const shown = n ? im : (() => { const o = document.createElement('span'), i = document.createElement('span'); o.className = 'stamp3'; i.className = 'stamp3in'; i.append(im); o.append(i); b.classList.add('hasstamp'); return o; })();
    if (act.length) {
      b.classList.add('cmp'); b.style.setProperty('--n', act.length + 1);
      const cell = (child, login) => { const c = document.createElement('span'); c.className = 'cph'; c.append(child); if (login) c.append(avatarBadge(login)); return c; };
      b.append(cell(shown, n ? (state.user?.login || viewLogin || meLogin) : ''));
      for (const p of act) {
        const url = partnerPhoto(p, t.id), who = '@' + p.login;
        if (url) { const pim = document.createElement('img'); pim.alt = ''; pim.loading = 'lazy'; pim.src = sized(url, 'medium'); pim.title = who; b.append(cell(pim, p.login)); }
        else { const e = document.createElement('span'); e.className = 'noph'; e.title = `${who} has not seen this`; b.append(cell(e, p.login)); }
      }
    } else b.append(shown);
  }
  if (n) { const k = document.createElement('span'); k.className = 'seentag'; k.textContent = '✓'; k.title = `Seen (${n})`; b.append(k); }
  { const c = document.createElement('span'); c.className = 'cntpill'; c.innerHTML = ic('eye', 15) + ' ' + fmtCount(it.count); c.title = `${it.count.toLocaleString()} observations here in this area`; b.append(c); }
  b.onclick = () => openSpecies(t.id);
  const cap = document.createElement('a');
  cap.className = 'cap'; cap.href = `https://www.inaturalist.org/taxa/${t.id}`; cap.target = '_blank'; cap.rel = 'noopener';
  speciesLink(cap, t.id);
  const sp = document.createElement('span'); sp.textContent = t.preferred_common_name || t.name; cap.append(sp); capObserver.observe(cap);
  tile.append(b, cap);
  return tile;
}
$('gal').addEventListener('click', e => {

autoMore($('expmore'));

  const score = it => (it.hay.startsWith(terms[0]) || it.hay.includes(' ' + terms[0]) ? 0 : 10) + (it.group ? Math.max(0, RANK_ORDER.indexOf(it.rank)) / 100 : 1);
  return hits.sort((a, b) => score(a) - score(b)).slice(0, 15);
}
function drawJump() {
  const box = $('jumpsug'), q = $('jump').value.trim();
  box.replaceChildren(); box.className = '';
  if (q.length < 1) { box.hidden = true; return; }
  const hits = jumpMatches(q);
  if (!hits.length) { box.textContent = 'No matching groups or species.'; box.className = 'status'; box.hidden = false; return; }
  for (const it of hits) {
    const b = document.createElement('button'); b.type = 'button';
    b.append(it.label);
    const sm = document.createElement('small'); sm.textContent = it.group ? it.sub : it.sub || 'species'; b.append(sm);
    b.onclick = () => jumpTo(it);
    box.append(b);
  }
  box.hidden = false;
}
function jumpTo(it) {
  $('jumpsug').hidden = true;
  closePanels('');
  const col = collapsed[gal.sort];
  // open the target's groups, and draw further pages if it is beyond the ones shown
  const idx = it.group ? it.g.first : it.i, path = it.group ? [...(function up(g) { return g.parent ? [...up(g.parent), g.parent] : []; })(it.g), it.g] : gal.items[it.i].path;
  path.forEach(g => col.delete(g.key));
  drawGallery();
  for (let guard = 0; gal.shownTo <= idx && gal.shownTo < gal.items.length && guard < 200; guard++) { gal.limit += GAL_PAGE; drawGallery(); }
  const cell = $('gal').querySelector(`.cell[data-i="${idx}"]`);
  if (!cell) return;
  setTimeout(() => {
    cell.scrollIntoView({ block: 'start', behavior: 'smooth' });
    const target = (it.group && cell.querySelector(`.tag[data-key="${CSS.escape(it.g.key)}"]`)) || cell.querySelector('.tile') || cell;
    target.classList.remove('flash'); void target.offsetWidth; target.classList.add('flash');
    setTimeout(() => target.classList.remove('flash'), 2000);
  }, 60);
  log(`jump to ${it.label}`);
}
$('jump').addEventListener('input', drawJump);
$('jump').addEventListener('focus', drawJump);
